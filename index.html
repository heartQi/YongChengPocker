<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PGame 纸牌馆</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/home.css" />
  </head>
  <body>
    <div class="home-atmosphere" aria-hidden="true">
      <div class="home-glow home-glow-a"></div>
      <div class="home-glow home-glow-b"></div>
      <div class="home-felt"></div>
      <div class="home-particles">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
    </div>

    <main class="home-shell">
      <header class="home-brand">
        <p class="home-kicker">本地离线 · 双玩法</p>
        <h1 class="home-title">
          <span class="home-title-mark">PGame</span>
          <span class="home-title-sub">纸牌馆</span>
        </h1>
        <p class="home-lead">选一桌开局，绿毡金边，筹码翻飞。</p>
      </header>

      <nav class="home-games" aria-label="选择游戏">
        <a class="game-portal portal-yongcheng" href="yongcheng.html">
          <span class="portal-suit" aria-hidden="true">♠</span>
          <span class="portal-label">进入牌桌</span>
          <strong class="portal-name">永城扑克</strong>
          <span class="portal-desc">河南八张 · 四人攻防</span>
          <span class="portal-shine" aria-hidden="true"></span>
        </a>

        <a class="game-portal portal-zhajinhua" href="zhajinhua.html">
          <span class="portal-suit" aria-hidden="true">♦</span>
          <span class="portal-label">进入牌桌</span>
          <strong class="portal-name">炸金花</strong>
          <span class="portal-desc">闷跟看牌 · 比牌夺池</span>
          <span class="portal-shine" aria-hidden="true"></span>
        </a>
      </nav>
    </main>
  </body>
</html>
